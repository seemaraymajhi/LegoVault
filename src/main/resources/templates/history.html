<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{history.title}">LegoVault - Session history</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>
<header th:replace="~{fragments :: nav('history')}"></header>

<main class="container mt-4">
    <h1 th:text="#{history.heading}">Pages visited in this session</h1>

    <p th:if="${#lists.isEmpty(visits)}"
       th:text="#{history.none}">No pages visited yet.</p>

    <table class="table table-striped table-hover"
           th:unless="${#lists.isEmpty(visits)}">
        <thead>
        <tr>
            <th>#</th>
            <th th:text="#{history.page}">Page</th>
            <th th:text="#{history.time}">Time</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="visit, stat : ${visits}">
            <td th:text="${stat.count}">1</td>
            <td th:text="${visit.page}">/legosets</td>
            <td th:text="${#temporals.format(visit.timestamp, 'dd/MM/yyyy HH:mm:ss')}">01/11/2026 22:00:00</td>
        </tr>
        </tbody>
    </table>

    <p th:unless="${#lists.isEmpty(visits)}"
       th:text="#{history.count(${#lists.size(visits)})}">3 visits</p>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
