<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{legopieces.title}">LegoVault - LEGO Pieces</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>
<header th:replace="~{fragments :: nav('legopieces')}"></header>

<main class="container mt-4">
    <h1 th:text="#{legopieces.heading}">LEGO Pieces</h1>

    <form class="row g-2 align-items-end mb-4"
          th:action="@{/legopieces/search}"
          method="get">
        <fieldset class="col-sm-6 col-md-4">
            <label for="name"
                   class="form-label"
                   th:text="#{legopieces.nameContains}">Name contains</label>

            <input id="name"
                   class="form-control"
                   type="search"
                   name="name"
                   th:value="${name}">
        </fieldset>

        <fieldset class="col-sm-6 col-md-4">
            <label for="material"
                   class="form-label"
                   th:text="#{legopiece.material}">Material</label>

            <select id="material"
                    class="form-select"
                    name="material">
                <option value=""
                        th:text="#{legopieces.anyMaterial}">-- Any --
                </option>

                <option th:each="m : ${materials}"
                        th:value="${m}"
                        th:text="#{${'material.' + m}}"
                        th:selected="${material == m.name()}">
                    PLASTIC
                </option>
            </select>
        </fieldset>

        <fieldset class="col-auto">
            <button type="submit"
                    class="btn btn-warning"
                    th:text="#{common.filter}">Filter
            </button>
            <a class="btn btn-outline-dark"
               th:href="@{/legopieces}"
               th:text="#{common.clear}">Clear</a>
        </fieldset>
    </form>

    <p th:if="${#lists.isEmpty(legoPieces)}"
       th:text="#{legopieces.none}">No LEGO pieces found.</p>

    <section class="card shadow-sm rounded-4 overflow-hidden mb-3"
             th:unless="${#lists.isEmpty(legoPieces)}">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-warning">
            <tr>
                <th th:text="#{legopiece.name}">Name</th>
                <th th:text="#{legopiece.color}">Color</th>
                <th th:text="#{legopiece.material}">Material</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="piece : ${legoPieces}">
                <td class="fw-semibold">
                    <i class="bi bi-puzzle-fill text-danger me-2" aria-hidden="true"></i>
                    <span th:text="${piece.name}">Name</span>
                </td>
                <td th:text="${piece.color}">Color</td>
                <td th:switch="${piece.material.name()}">
                    <span th:case="'PLASTIC'"
                          class="badge rounded-pill text-bg-primary"
                          th:text="#{material.PLASTIC}">Plastic</span>
                    <span th:case="'RUBBER'"
                          class="badge rounded-pill text-bg-dark"
                          th:text="#{material.RUBBER}">Rubber</span>
                    <span th:case="*"
                          class="badge rounded-pill text-bg-secondary"
                          th:text="#{material.METAL}">Metal</span>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
    <p th:unless="${#lists.isEmpty(legoPieces)}"
       th:text="#{legopieces.count(${#lists.size(legoPieces)})}">10 LEGO pieces</p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
