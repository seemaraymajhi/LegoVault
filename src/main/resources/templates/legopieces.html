<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="#{legopieces.title}">LegoVault - LEGO Pieces</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
  <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
  <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>
<nav th:replace="~{fragments :: nav}"></nav>

<main class="container mt-4">
  <h1 th:text="#{legopieces.heading}">LEGO Pieces</h1>

  <form th:action="@{/legopieces/search}"
        method="get">
    <label for="name"
           th:text="#{legopieces.nameContains}">Name contains</label>

    <input id="name"
           type="search"
           name="name"
           th:value="${name}">

    <label for="material"
           th:text="#{legopiece.material}">Material</label>

    <select id="material"
            name="material">
      <option value=""
              th:text="#{legopieces.anyMaterial}">-- Any --</option>

      <option th:each="m : ${materials}"
              th:value="${m}"
              th:text="${m}"
              th:selected="${material == m.name()}">
        PLASTIC
      </option>
    </select>

    <button type="submit"
            th:text="#{common.filter}">Filter</button>
    <a th:href="@{/legopieces}"
       th:text="#{common.clear}">Clear</a>
  </form>

  <p th:if="${#lists.isEmpty(legoPieces)}"
     th:text="#{legopieces.none}">No LEGO pieces found.</p>

  <table class="table table-striped table-hover"
         th:unless="${#lists.isEmpty(legoPieces)}">
    <thead>
    <tr>
      <th th:text="#{legopiece.name}">Name</th>
      <th th:text="#{legopiece.color}">Color</th>
      <th th:text="#{legopiece.material}">Material</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="piece : ${legoPieces}">
      <td th:text="${piece.name}">Name</td>
      <td th:text="${piece.color}">Color</td>
      <td th:text="${piece.material}">PLASTIC</td>
    </tr>
    </tbody>
  </table>
  <p th:unless="${#lists.isEmpty(legoPieces)}"
     th:text="#{legopieces.count(${#lists.size(legoPieces)})}">10 LEGO pieces</p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
