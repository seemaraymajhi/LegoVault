<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{legosetdetails.title}">LegoVault - LEGO Set Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>
<header th:replace="~{fragments :: nav}"></header>

<main class="container mt-4">
    <h1 class="mb-4"
        th:text="${legoSet.name}">LEGO set name</h1>

    <article class="row g-4">
        <figure class="col-md-5">
            <img class="img-fluid rounded border p-2"
                 th:src="${legoSet.imageUrl}"
                 th:alt="${legoSet.name}">
        </figure>

        <section class="col-md-7">
            <dl class="row">
                <dt class="col-sm-4" th:text="#{legoset.pieceCount}">Pieces</dt>
                <dd class="col-sm-8" th:text="${legoSet.pieceCount}">0</dd>

                <dt class="col-sm-4" th:text="#{legoset.price}">Price (EUR)</dt>
                <dd class="col-sm-8" th:text="${#numbers.formatDecimal(legoSet.price, 1, 2)}">0.00</dd>

                <dt class="col-sm-4" th:text="#{legoset.releaseDate}">Release date</dt>
                <dd class="col-sm-8" th:text="${legoSet.releaseDate}">2020-01-01</dd>

                <dt class="col-sm-4" th:text="#{legoset.difficulty}">Difficulty</dt>

                <dd class="col-sm-8" th:text="#{${'difficulty.' + legoSet.difficulty}}">EASY</dd>

                <dt class="col-sm-4" th:text="#{legoset.retired}">Retired</dt>
                <dd class="col-sm-8" th:text="${legoSet.retired} ? #{common.yes} : #{common.no}">No</dd>

                <dt class="col-sm-4" th:text="#{legoset.theme}">Theme</dt>
                <dd class="col-sm-8"
                    th:text="${legoSet.theme != null} ? ${legoSet.theme.name} : #{legosetdetails.noTheme}">
                    Theme
                </dd>
            </dl>


            <section class="accordion mb-4"
                     id="themeAccordion"
                     th:if="${legoSet.theme != null}">
                <article class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed"
                                type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#themeInfo"
                                aria-expanded="false"
                                aria-controls="themeInfo"
                                th:text="#{legosetdetails.aboutTheme(${legoSet.theme.name})}">
                            About the theme
                        </button>
                    </h2>

                    <section id="themeInfo"
                             class="accordion-collapse collapse"
                             data-bs-parent="#themeAccordion">
                        <section class="accordion-body">
                            <p class="mb-1">
                                <strong th:text="#{theme.ageRange}">Age range</strong>:
                                <span th:text="${legoSet.theme.ageRange}">9+</span>
                            </p>

                            <p class="mb-0"
                               th:text="${legoSet.theme.description}">Description</p>
                        </section>
                    </section>
                </article>
            </section>

            <h2 class="h5"
                th:text="#{legoset.pieces}">LEGO pieces</h2>

            <p th:if="${#lists.isEmpty(legoSet.legoPieces)}"
               th:text="#{legosetdetails.noPieces}">This set contains no LEGO pieces.</p>

            <ul class="list-group mb-4"
                th:unless="${#lists.isEmpty(legoSet.legoPieces)}">
                <li class="list-group-item"
                    th:each="piece : ${legoSet.legoPieces}"
                    th:text="${piece.name} + ' (' + ${piece.color} + ')'">
                    Piece (Color)
                </li>
            </ul>

            <a class="btn btn-dark"
               th:href="@{/legosets}">
                <i class="bi bi-arrow-left-circle-fill"
                   aria-hidden="true"></i>
                <span th:text="#{common.back}">Back to overview</span>
            </a>
        </section>
    </article>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
