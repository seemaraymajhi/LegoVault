<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{addlegopiece.title}">LegoVault - Add LEGO Piece</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<header th:replace="~{fragments :: nav}"></header>

<main class="container mt-4">
    <h1 th:text="#{addlegopiece.heading}">Add a LEGO Piece</h1>

    <form class="row g-3"
          th:action="@{/legopieces/add}"
          th:object="${legoPieceForm}"
          method="post">

        <fieldset class="col-md-6">
            <label for="name"
                   class="form-label"
                   th:text="#{legopiece.name}">Name</label>

            <input id="name"
                   class="form-control"
                   type="text"
                   th:field="*{name}"
                   th:errorclass="is-invalid"
                   required>
            <p class="invalid-feedback"
               th:if="${#fields.hasErrors('name')}"
               th:errors="*{name}">Name error</p>
        </fieldset>

        <fieldset class="col-md-6">
            <label for="color"
                   class="form-label"
                   th:text="#{legopiece.color}">Color</label>

            <input id="color"
                   class="form-control"
                   type="text"
                   th:field="*{color}"
                   th:errorclass="is-invalid"
                   required>
            <p class="invalid-feedback"
               th:if="${#fields.hasErrors('color')}"
               th:errors="*{color}">Color error</p>
        </fieldset>

        <fieldset class="col-12">
            <label for="material"
                   class="form-label"
                   th:text="#{legopiece.material}">Material</label>

            <select id="material"
                    class="form-select"
                    th:field="*{material}"
                    th:errorclass="is-invalid"
                    required>

                <option value=""
                        th:text="#{addlegopiece.selectMaterial}">-- Select a material --
                </option>

                <option th:each="m : ${materials}"
                        th:value="${m}"
                        th:text="#{${'material.' + m}}">
                    PLASTIC
                </option>
            </select>
            <p class="invalid-feedback"
               th:if="${#fields.hasErrors('material')}"
               th:errors="*{material}">Material error</p>
        </fieldset>
        <fieldset class="col-12">
            <button type="submit"
                    class="btn btn-warning"
                    th:text="#{addlegopiece.submit}">Add LEGO Piece
            </button>
        </fieldset>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
