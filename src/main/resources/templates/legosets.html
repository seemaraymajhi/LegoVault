<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:h="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title th:text="#{legosets.title}">LegoVault - LEGO Sets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>
<header th:replace="~{fragments :: nav('legosets')}"></header>

<main class="container mt-4">
    <h1 th:text="#{legosets.heading}">LEGO Sets</h1>

    <form class="row g-2 align-items-end mb-4"
          th:action="@{/legosets/search}"
          method="get">
        <fieldset class="col-sm-6 col-md-4">
            <label for="minPieces"
                   class="form-label"
                   th:text="#{legosets.minPieces}">Minimum number of pieces</label>

            <input id="minPieces"
                   class="form-control"
                   type="number"
                   name="minPieces"
                   min="0"
                   step="1"
                   required
                   th:value="${minPieces}">
        </fieldset>

        <fieldset class="col-auto">
            <button type="submit"
                    class="btn btn-warning"
                    th:text="#{common.filter}">Filter
            </button>
            <a class="btn btn-outline-dark"
               th:href="@{/legosets}"
               th:text="#{common.clear}">Clear</a>
        </fieldset>
    </form>

    <aside class="alert alert-warning alert-dismissible fade show d-none d-lg-block"
           role="note">
        <span th:text="#{legosets.largeHint}">Tip: LEGO sets with more than 5000 pieces have a yellow border.</span>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                th:aria-label="#{common.close}">
        </button>
    </aside>

    <p th:if="${#lists.isEmpty(legoSets)}"
       th:text="#{legosets.none}">No LEGO sets found.</p>

    <ul class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4 list-unstyled"
        th:unless="${#lists.isEmpty(legoSets)}">
        <li class="col"
            th:each="set : ${legoSets}">
            <article class="card h-100 shadow-sm rounded-4"
                     th:classappend="${set.pieceCount > 5000} ? 'border-warning border-3'">
                <span th:if="${set.retired}"
                      class="badge text-bg-secondary position-absolute top-0 end-0 m-2"
                      th:text="#{legoset.retired}">Retired</span>
                <figure class="ratio ratio-4x3 mb-0">
                    <img class="card-img-top object-fit-contain p-3"
                         th:src="${set.imageUrl}"
                         th:alt="${set.name}">
                </figure>
                <section class="card-body d-flex flex-column">
                    <p class="d-flex gap-3 small text-body-secondary mb-2">
                        <span th:if="${set.theme != null}">
                            <i class="bi bi-cake2 me-1" aria-hidden="true"></i>
                            <span class="visually-hidden" th:text="#{theme.ageRange}">Age range</span>
                            <span th:text="${set.theme.ageRange}">9+</span>
                        </span>
                        <span>
                            <i class="bi bi-bricks me-1" aria-hidden="true"></i>
                            <span class="visually-hidden" th:text="#{legoset.pieceCount}">Pieces</span>
                            <span th:text="${set.pieceCount}">7541</span>
                        </span>
                    </p>
                    <h2 class="card-title h5" th:text="${set.name}">Name</h2>
                    <p class="fs-5 fw-bold mb-2"
                       th:text="'€ ' + ${#numbers.formatDecimal(set.price, 1, 2)}">€ 849,99</p>
                    <p class="d-flex flex-wrap gap-1 mb-3">
                        <th:block th:switch="${set.difficulty.name()}">
                            <span th:case="'EASY'"
                                  class="badge text-bg-success"
                                  th:text="#{difficulty.EASY}">EASY</span>
                            <span th:case="'MEDIUM'"
                                  class="badge text-bg-info"
                                  th:text="#{difficulty.MEDIUM}">MEDIUM</span>
                            <span th:case="'HARD'"
                                  class="badge text-bg-warning"
                                  th:text="#{difficulty.HARD}">HARD</span>
                            <span th:case="*"
                                  class="badge text-bg-dark"
                                  th:text="#{difficulty.EXPERT}">EXPERT</span>
                        </th:block>
                    </p>
                    <a class="btn btn-warning rounded-pill fw-semibold stretched-link mt-auto"
                       th:href="@{/legosets/{id}(id=${set.id})}">
                        <i class="bi bi-eye me-1" aria-hidden="true"></i>
                        <span th:text="#{legosets.viewDetails}">View details</span>
                    </a>
                </section>
            </article>
        </li>
    </ul>

    <p th:unless="${#lists.isEmpty(legoSets)}"
       th:text="#{legosets.count(${#lists.size(legoSets)})}">10 LEGO sets</p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
