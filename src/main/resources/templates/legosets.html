<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{legosets.title}">LegoVault - LEGO Sets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>
<nav th:replace="~{fragments :: nav}"></nav>

<main>
    <h1 th:text="#{legosets.heading}">LEGO Sets</h1>

    <form th:action="@{/legosets/search}" method="get">
        <label for="minPieces" th:text="#{legosets.minPieces}">Minimum number of pieces</label>

        <input id="minPieces"
               type="number"
               name="minPieces"
               min="0"
               step="1"
               required
               th:value="${minPieces}">

        <button type="submit" th:text="#{common.filter}">Filter</button>
        <a th:href="@{/legosets}" th:text="#{common.clear}">Clear</a>
    </form>

    <p th:if="${#lists.isEmpty(legoSets)}" th:text="#{legosets.none}">No LEGO sets found.</p>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4"
         th:unless="${#lists.isEmpty(legoSets)}">
        <div class="col" th:each="set : ${legoSets}">
            <div class="card h-100 shadow-sm"
                 th:classappend="${set.pieceCount > 5000} ? 'border-warning border-3'">
                <div class="ratio ratio-4x3">
                    <img class="card-img-top object-fit-contain p-2"
                         th:src="${set.imageUrl}" th:alt="${set.name}">
                </div>
                <div class="card-body">
                    <h2 class="card-title h5" th:text="${set.name}">Name</h2>
                    <p class="card-text" th:text="#{legoset.pieceCount} + ': ' + ${set.pieceCount}">Pieces: 0</p>
                </div>
            </div>
        </div>
    </div>

    <p th:unless="${#lists.isEmpty(legoSets)}"
       th:text="#{legosets.count(${#lists.size(legoSets)})}">10 LEGO sets</p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
