<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="nav" class="navbar navbar-expand-lg bg-warning border-bottom border-dark border-3 shadow-sm" data-bs-theme="light" aria-label="Main navigation">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/legosets}">
            <i class="bi bi-bricks me-1" aria-hidden="true"></i>
            <span th:text="#{nav.brand}">LegoVault</span>
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" th:aria-label="#{nav.toggle}">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/legosets}">
                        <i class="bi bi-grid-3x3-gap me-1" aria-hidden="true"></i>
                        <span th:text="#{nav.legosets}">LEGO Sets</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/legopieces}">
                        <i class="bi bi-puzzle me-1" aria-hidden="true"></i>
                        <span th:text="#{nav.legopieces}">LEGO Pieces</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/legosets/add}">
                        <i class="bi bi-plus-circle me-1" aria-hidden="true"></i>
                        <span th:text="#{nav.addlegoset}">Add LEGO Set</span>                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/legopieces/add}">
                        <i class="bi bi-plus-square me-1" aria-hidden="true"></i>
                        <span th:text="#{nav.addlegopiece}">Add LEGO Piece</span>                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-warning text-dark text-center py-3 mt-5 border-top border-dark border-3">
    <p class="mb-0">
        <i class="bi bi-bricks me-1" aria-hidden="true"></i>
        <span th:text="#{footer.copyright}">&copy; 2026 LegoVault</span>
    </p>
</footer>

</body>
</html>
